# The tools that build the site: Hugo and Pagefind, each from PyPI at one
# version. uv.lock holds every file's hash, so `uv run --frozen` installs
# exactly these, on Linux, macOS or Windows, from PyPI or a mirror of it.
[project]
name = "knowledge-website"
version = "0.0.0"
description = "The tools that build the knowledge website."
requires-python = ">=3.11"
dependencies = ["hugo==0.169.0", "pagefind[extended]==1.6.0"]

[tool.uv]
package = false
