{{- if eq .Type "alert" -}}
<div class="alert alert--{{ .AlertType }}" role="note"{{ partial "own.html" . }}>
  <p class="alert__title"{{ partial "own.html" . }}>{{ .AlertTitle | default (.AlertType | strings.FirstUpper) }}</p>
  {{ .Text }}
</div>
{{- else -}}
<blockquote>{{ .Text }}</blockquote>
{{- end -}}
