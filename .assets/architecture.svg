<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-labelledby="t d">
  <title id="t">AI-LinkMO architecture</title>
  <desc id="d">Sources (IBM AI Atlas Nexus ontology and data, nine bring-your-own-data frameworks) feed one linked model in lib/ (exposure view, library or DuckDB store, generated artefacts), which serves four doors: CLI, FastAPI, Svelte web UI and Neo4j, plus Datasette.</desc>
  <defs>
    <style>
      :root{--bg:#ffffff;--ink:#1f2328;--muted:#57606a;--line:#6e7781;
        --src:#eaf1fd;--srcS:#3b6fd8;--mod:#fff5e2;--modS:#c48a12;--door:#e7f5ec;--doorS:#2e8b57;
        --chip:#ffffff;--opt:#f6f8fa;--optS:#8c959f;--warn:#b42318}
      @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9da7b3;--line:#8b949e;
        --src:#0f2240;--srcS:#6ea0ff;--mod:#2d220b;--modS:#e3b341;--door:#0f2a1b;--doorS:#56d38a;
        --chip:#161b22;--opt:#161b22;--optS:#6e7681;--warn:#ff7b72}}
      text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
      .h1{font-size:30px;font-weight:700}.sub{font-size:17px;fill:var(--muted)}
      .col{font-size:15px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}
      .pt{font-size:17px;font-weight:700}.bt{font-size:15px;font-weight:700}
      .b{font-size:13.5px}.m{font-size:12.5px;fill:var(--muted)}
      .mono{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:12.5px}
      .tag{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:var(--muted)}
      .src{fill:var(--src);stroke:var(--srcS);stroke-width:1.5}
      .mod{fill:var(--mod);stroke:var(--modS);stroke-width:1.5}
      .door{fill:var(--door);stroke:var(--doorS);stroke-width:1.5}
      .chip{fill:var(--chip);stroke:var(--line);stroke-width:1}
      .opt{fill:var(--opt);stroke:var(--optS);stroke-width:1.5;stroke-dasharray:6 4}
      .a{fill:none;stroke:var(--line);stroke-width:1.8;marker-end:url(#arr)}
      .ad{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#arr)}
      .al{font-size:11.5px;fill:var(--muted);font-style:italic}
      .warn{fill:var(--warn);font-size:13px;font-weight:600}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect width="1600" height="840" fill="var(--bg)"/>

  <!-- Title -->
  <text x="40" y="52" class="h1">AI-LinkMO architecture</text>
  <text x="40" y="82" class="sub">Regulation in ⟹ auditable, queryable AI governance out.</text>

  <!-- Column headers -->
  <text x="40" y="124" class="col">SOURCES</text>
  <text x="540" y="124" class="col">ONE LINKED MODEL · lib/</text>
  <text x="1120" y="124" class="col">FOUR DOORS</text>

  <!-- ===== Sources ===== -->
  <rect x="40" y="138" width="440" height="230" rx="12" class="src"/>
  <text x="60" y="166" class="pt">IBM AI Atlas Nexus</text>
  <text x="226" y="166" class="tag">upstream package</text>

  <rect x="60" y="182" width="400" height="76" rx="8" class="chip"/>
  <text x="76" y="206" class="bt">AI Risk Ontology · LinkML</text>
  <text x="76" y="228" class="b">risks · controls · obligations · taxonomies</text>
  <text x="76" y="247" class="b">models · evaluations · incidents</text>

  <rect x="60" y="270" width="400" height="56" rx="8" class="chip"/>
  <text x="76" y="294" class="bt">Packaged risk data</text>
  <text x="76" y="314" class="b">IBM AI Risk Atlas + public taxonomies</text>

  <text x="60" y="350" class="m">+ Cypher export, fetched per release</text>

  <rect x="40" y="388" width="440" height="272" rx="12" class="src"/>
  <text x="60" y="416" class="pt">Bring your own data</text>
  <text x="240" y="416" class="tag">byo/data/</text>
  <rect x="60" y="432" width="126" height="34" rx="6" class="chip"/><text x="123" y="454" text-anchor="middle" class="b">NIST AI 600-1</text>
  <rect x="197" y="432" width="126" height="34" rx="6" class="chip"/><text x="260" y="454" text-anchor="middle" class="b">EU AI Act</text>
  <rect x="334" y="432" width="126" height="34" rx="6" class="chip"/><text x="397" y="454" text-anchor="middle" class="b">ISO/IEC 42001</text>
  <rect x="60" y="474" width="126" height="34" rx="6" class="chip"/><text x="123" y="496" text-anchor="middle" class="b">FINOS AIGF</text>
  <rect x="197" y="474" width="126" height="34" rx="6" class="chip"/><text x="260" y="496" text-anchor="middle" class="b">OWASP LLM 10</text>
  <rect x="334" y="474" width="126" height="34" rx="6" class="chip"/><text x="397" y="496" text-anchor="middle" class="b">OWASP ML 10</text>
  <rect x="60" y="516" width="126" height="34" rx="6" class="chip"/><text x="123" y="538" text-anchor="middle" class="b">SR 11-7</text>
  <rect x="197" y="516" width="126" height="34" rx="6" class="chip"/><text x="260" y="538" text-anchor="middle" class="b">FFIEC IT</text>
  <rect x="334" y="516" width="126" height="34" rx="6" class="chip"/><text x="397" y="538" text-anchor="middle" class="b">NIST SP 800-53</text>
  <text x="60" y="604" class="b">+ your own taxonomy YAML</text>
  <text x="60" y="628" class="m">opt in with --byod · edit in the UI's curate mode</text>

  <!-- ===== Linked model ===== -->
  <rect x="540" y="138" width="520" height="522" rx="12" class="mod"/>

  <rect x="560" y="158" width="480" height="84" rx="8" class="chip"/>
  <text x="576" y="182" class="bt">Exposure view</text>
  <text x="692" y="182" class="tag">exposure.py</text>
  <text x="576" y="206" class="b"><tspan class="mono">api.yaml</tspan> ⨝ schema slots</text>
  <text x="576" y="228" class="b">→ one route, one CLI command, one filter per slot</text>

  <text x="560" y="268" class="m">one data source, picked by AI_LINKMO_DATA_SOURCE</text>
  <rect x="560" y="278" width="232" height="86" rx="8" class="chip"/>
  <text x="574" y="302" class="bt">AIAtlasNexus library</text>
  <text x="574" y="324" class="b">in process</text>
  <text x="574" y="344" class="m">lookups · crosswalks · inference</text>

  <rect x="808" y="278" width="232" height="86" rx="8" class="chip"/>
  <text x="822" y="302" class="bt">DuckDB record store</text>
  <text x="822" y="324" class="b">via linkml-store</text>
  <text x="822" y="344" class="m">fast listings · trigram search</text>

  <rect x="560" y="384" width="480" height="256" rx="8" class="chip"/>
  <text x="576" y="408" class="bt">Generated artefacts</text>
  <text x="742" y="408" class="m">by just · ✓ committed</text>
  <text x="576" y="438" class="mono">openapi.json ✓</text><text x="820" y="438" class="m">API contract</text>
  <text x="576" y="466" class="mono">entities.json ✓</text><text x="820" y="466" class="m">UI entity list</text>
  <text x="576" y="494" class="mono">crosswalk CSVs</text><text x="820" y="494" class="m">framework ↔ framework</text>
  <text x="576" y="522" class="mono">ai-risk-ontology.cypher</text><text x="820" y="522" class="m">graph import</text>
  <text x="576" y="550" class="mono">atlas + byod .sqlite</text><text x="820" y="550" class="m">browse tables</text>
  <line x1="576" y1="572" x2="1024" y2="572" stroke="var(--line)" stroke-width="0.6"/>
  <text x="576" y="598" class="m">CI keeps the doors in step: CLI ≡ API · contract ≡ server</text>
  <text x="576" y="618" class="m">UI list ≡ api.yaml · every CLI example runs as a test</text>

  <!-- ===== Doors ===== -->
  <rect x="1120" y="138" width="440" height="94" rx="12" class="door"/>
  <text x="1140" y="166" class="pt">CLI</text><text x="1180" y="166" class="tag">./ai</text>
  <text x="1140" y="190" class="b">via the API by default · --mode local runs offline</text>
  <text x="1140" y="214" class="m">Engineers · CI/CD</text>

  <rect x="1120" y="256" width="440" height="94" rx="12" class="door"/>
  <text x="1140" y="284" class="pt">FastAPI backend</text><text x="1286" y="284" class="tag">:8000</text>
  <text x="1140" y="308" class="b">one GET per class · OpenAPI 3.1 contract</text>
  <text x="1140" y="332" class="m">Integrators · GRC tools</text>

  <rect x="1120" y="374" width="440" height="94" rx="12" class="door"/>
  <text x="1140" y="402" class="pt">Svelte web UI</text><text x="1268" y="402" class="tag">:5173</text>
  <text x="1140" y="426" class="b">browse records · curate your own</text>
  <text x="1140" y="450" class="m">Risk and compliance teams</text>

  <rect x="1120" y="492" width="440" height="94" rx="12" class="door"/>
  <text x="1140" y="520" class="pt">Neo4j graph</text><text x="1252" y="520" class="tag">:7474</text>
  <text x="1140" y="544" class="b">cross-taxonomy queries · packaged data only</text>
  <text x="1140" y="568" class="m">Analysts</text>

  <rect x="1120" y="606" width="440" height="54" rx="12" class="opt"/>
  <text x="1140" y="639" class="bt">Datasette</text><text x="1222" y="639" class="tag">:8001</text>
  <text x="1280" y="639" class="m">facet, search, export · draft</text>

  <!-- ===== Arrows: sources → model ===== -->
  <path class="a" d="M460,210 H510 V199 H560"/>
  <text x="488" y="190" class="al">schema</text>
  <path class="a" d="M460,236 H498 V308 H560"/>
  <path class="a" d="M460,298 H488 V334 H560"/>
  <path class="ad" d="M480,520 H522 V352 H560"/>
  <text x="484" y="540" class="al">--byod</text>

  <!-- ===== Arrows: model → doors ===== -->
  <path class="a" d="M1040,186 H1120"/>
  <text x="1066" y="178" class="al">view</text>
  <path class="a" d="M1040,224 H1080 V286 H1120"/>
  <path class="a" d="M1040,320 H1120"/>
  <text x="1062" y="312" class="al">records</text>
  <path class="a" d="M1040,466 H1120"/>
  <text x="1062" y="458" class="al">entities</text>
  <path class="a" d="M1040,522 H1120"/>
  <text x="1064" y="514" class="al">import</text>
  <path class="a" d="M1040,550 H1088 V633 H1120"/>

  <!-- door → door -->
  <path class="a" d="M1500,232 V256"/>
  <text x="1508" y="249" class="al">HTTP</text>
  <path class="a" d="M1500,374 V350"/>
  <text x="1508" y="367" class="al">proxy</text>

  <!-- ===== Bottom band ===== -->
  <rect x="40" y="690" width="700" height="96" rx="12" class="opt"/>
  <text x="60" y="718" class="bt">Optional · your infrastructure</text>
  <text x="60" y="744" class="b">LLM risk inference (e.g. vLLM) · ARES evaluation (pending upstream)</text>
  <text x="60" y="768" class="m">Roadmap: policy → risk mapping · provenance on records</text>

  <rect x="770" y="690" width="790" height="96" rx="12" class="chip"/>
  <rect x="790" y="709" width="22" height="14" rx="3" class="src"/><text x="820" y="721" class="b">Sources</text>
  <rect x="900" y="709" width="22" height="14" rx="3" class="mod"/><text x="930" y="721" class="b">Linked model</text>
  <rect x="1052" y="709" width="22" height="14" rx="3" class="door"/><text x="1082" y="721" class="b">Doors</text>
  <rect x="1150" y="709" width="22" height="14" rx="3" class="opt"/><text x="1180" y="721" class="b">Optional or draft</text>
  <text x="790" y="756" class="warn">Demo: keep on localhost. Write endpoints are unauthenticated.</text>

  <text x="40" y="818" class="m">Built on IBM AI Atlas Nexus. Framework authors are credited in NOTICE. Apache-2.0.</text>
</svg>
