name: UI Tests

on:
  push:
    branches: [main]
    paths:
      - "lib/frontend/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "lib/frontend/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

# Least-privilege default; see cli-tests.yml for the reasoning.
permissions: {}

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lib/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Audit-mode egress monitor. This job runs npm lifecycle scripts (`npm ci`
      # below runs esbuild's and Playwright's, which fetch platform binaries)
      # and then a headless browser, so it has the widest dependency surface of
      # any workflow here. `--ignore-scripts` is left off here: the
      # Vite/Playwright toolchain needs those scripts to produce a working
      # build, so the monitor, not script suppression, is the control.
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: lib/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit + browser tests
        run: npm test

      - name: Production build
        run: npm run build
