name: Knowledge Librarian

# Scheduled LLM "librarian" that keeps the .lokf/ bundle in step with the repo (the
# Karpathy rule): run the agent, validate, and open a review PR with whatever
# changed. It NEVER pushes to the default branch and NEVER auto-merges; no changes
# -> no PR; and it is inert until KNOWLEDGE_LIBRARIAN_ENABLED is set to "true".
#
# Two jobs, for least privilege. The `refresh` job runs the agent (third-party
# code) under a read-only token with no git credentials on disk, then hands the
# proposed bundle change to `publish` as a patch artifact. Only `publish`, which
# runs no agent code, holds the contents-write / pull-requests-write token used
# to push the branch and open the PR, so a compromised agent cannot reach it.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:

permissions: {} # deny by default; each job requests only the scopes it needs

concurrency:
  group: knowledge-librarian
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the LOKF bundle (agent, read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repo only; no write token near the agent
      # Lets the job token pay for Copilot CLI requests. The token reaches the
      # agent only when AGENT_USE_JOB_TOKEN is "true" (see the agent step);
      # until then the scope is idle. actionlint 1.7.12 does not know this
      # scope yet, so the lint step ignores that one message.
      copilot-requests: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      validate_outcome: ${{ steps.validate-lokf.outcome }}
      drafts: ${{ steps.curator.outputs.drafts }}
      questions: ${{ steps.curator.outputs.questions }}
      human: ${{ steps.curator.outputs.human }}
    steps:
      # Same audit-mode egress monitor step 5's other templates use; this job
      # installs packages, installs a skill everywhere but the repository
      # that publishes it, and runs a third-party agent.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # keep GITHUB_TOKEN off disk while the agent runs

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install the lokf sidecar
        id: install-lokf
        continue-on-error: true
        run: uv sync --locked
        working-directory: .lokf

      # ktl-librarian is runtime state here, not source (Step 5's own hygiene
      # note: .agents/ and .claude/ are gitignored), so a scheduled run cannot
      # rely on it already being present in the checkout. Install it fresh,
      # pinned to one release, on every run. A plain clone of the tagged
      # public repo needs no `gh` flags and no token. The install target is
      # gitignored, so it is invisible both to "Enforce the agent's write
      # scope" below and to "Detect changes". The one repository that skips
      # this step is the one it clones from, named again in the `if`: there
      # the skill is source under bare skills/, and an install would land in
      # .agents/skills/, which the wrapper searches first, so the pinned
      # release would run instead of the current one. Repository identity is
      # the switch, not a file in the tree, so nothing a host commits can
      # change which instructions its scheduled agent runs. A fork that
      # develops the skills changes the name in both places.
      - name: Install the pinned ktl-librarian skill
        if: github.repository != 'noelmcloughlin/knowledge-trust-ladder'
        env:
          TRUST_LADDER_SKILLS_REPO: https://github.com/noelmcloughlin/knowledge-trust-ladder
          TRUST_LADDER_SKILLS_REF: v0.26.0 # the one pin; point your docs here instead of repeating it
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$TRUST_LADDER_SKILLS_REF" "$TRUST_LADDER_SKILLS_REPO" "$tmp"
          mkdir -p .agents/skills
          rm -rf .agents/skills/ktl-librarian
          cp -R "$tmp/skills/ktl-librarian" .agents/skills/
          test -f .agents/skills/ktl-librarian/SKILL.md
          echo "Installed ktl-librarian@$TRUST_LADDER_SKILLS_REF"

      # Both agent commands the sidecar documents run through npx, and Copilot
      # CLI needs Node 22 or newer, which a runner image does not promise.
      - name: Set up Node for the agent
        if: vars.KNOWLEDGE_LIBRARIAN_ENABLED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Wire this up under Settings -> Secrets and variables -> Actions. The
      # sidecar's references/automation.md gives the full commands for Copilot
      # CLI and for Claude Code.
      #   1. Set KNOWLEDGE_LIBRARIAN_ENABLED to "true" to arm the run. Anything
      #      else (or unset) leaves this step skipped, a safe no-op.
      #   2. Set AGENT_CLI to your non-interactive agent command; the wrapper
      #      appends -p "<prompt>". It splits the value on whitespace and
      #      honours no quotes, so no flag value may contain a space. Keep the
      #      credential out of it. If the command must embed one, make
      #      AGENT_CLI a *secret* instead: secrets are masked in logs, `vars.`
      #      are not, and public-repo logs are world-readable.
      #   3. Set AGENT_API_KEY_ENV to the name the agent reads its credential
      #      from: COPILOT_GITHUB_TOKEN for Copilot CLI, ANTHROPIC_API_KEY for
      #      Claude Code. The wrapper hands it to the agent under that name only.
      #   4. Then either set AGENT_USE_JOB_TOKEN to "true", so the job's own
      #      GITHUB_TOKEN is that credential (Copilot CLI: no key to keep, and
      #      the requests are billed to the repository owner's Copilot seat, or
      #      to the organisation); or put the key in the AGENT_API_KEY secret.
      #
      # What runs is fixed to the reviewed, in-repo wrapper below, not an arbitrary
      # command string from a repo variable. So changing *what executes* goes
      # through code review, not an unreviewed Settings edit.
      #
      # Security rationale (human + automated reviewers): AGENT_CLI is trusted,
      # admin-set config (not untrusted input). The wrapper parses it into a quoted
      # argv array and runs it directly (no eval, no re-expansion), and only here,
      # in this read-only job (contents: read, no persisted credentials). A post-run
      # check fails if the agent writes outside .lokf/knowledge/. Contained by
      # design, not arbitrary execution.
      - name: Run the librarian agent
        if: vars.KNOWLEDGE_LIBRARIAN_ENABLED == 'true'
        env:
          AGENT_CLI: ${{ vars.AGENT_CLI || secrets.AGENT_CLI }}
          AGENT_API_KEY: ${{ vars.AGENT_USE_JOB_TOKEN == 'true' && github.token || secrets.AGENT_API_KEY }}
          AGENT_API_KEY_ENV: ${{ vars.AGENT_API_KEY_ENV }}
        run: bash .lokf/scripts/knowledge-librarian.sh

      # The wrapper enforces this same boundary itself, immediately after the
      # agent returns. It also restores .git/config and .git/hooks around the
      # call, from an EXIT trap, so a failing agent or a cancelled job restores
      # too. That keeps a poisoned core.fsmonitor/hooksPath from blinding
      # either check (see the wrapper's own comments). This is the second,
      # independent layer: it runs even when the wrapper did not get to (agent
      # disarmed, early exit), so no path outside the bundle can reach
      # `publish` in the patch.
      - name: Enforce the agent's write scope
        if: vars.KNOWLEDGE_LIBRARIAN_ENABLED == 'true'
        run: |
          set -euo pipefail
          out="$(git status --porcelain -- . ':!.lokf/knowledge' ':!knowledge_bundle' ':!.lokf/feedback.md' ':!.lokf/uv.lock')"
          if [ -n "$out" ]; then
            echo "::error::The librarian agent touched files outside .lokf/knowledge/ and .lokf/feedback.md:"
            echo "$out"
            exit 1
          fi

      - name: Validate the LOKF bundle
        id: validate-lokf
        if: steps.install-lokf.outcome == 'success'
        continue-on-error: true
        run: uv run lokf validate --check-refs knowledge
        working-directory: .lokf

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          # Scope to the bundle so tool artifacts (e.g. a fresh .lokf/uv.lock from
          # `uv sync`) never trigger a PR by themselves. Both of the bundle's
          # names are listed: with ktl-sidecar's doorway link the second
          # matches nothing, harmlessly, and it still covers a host rearranged
          # by hand into a real knowledge_bundle/ with .lokf/knowledge a link
          # onto it, since a git pathspec never traverses a symlink. A name
          # that does not exist in this repository is simply ignored.
          if [ -n "$(git status --porcelain -- .lokf/knowledge knowledge_bundle)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Plain-language counts for the PR's "For the curator" section. Computed
      # from frontmatter with grep: deterministic, no dependence on what the
      # agent printed. The ktl-curator skill's own report is the authoritative
      # version; this is the nudge that gets a busy person to run it.
      - name: Summarise for the curator
        id: curator
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          count() {
            grep -rlE "$1" --include='*.md' .lokf/knowledge 2>/dev/null \
              | grep -vE '/(index|log)\.md$' \
              | grep -c . || true
          }
          {
            echo "drafts=$(count '^status: *draft')"
            echo "questions=$(count '^## Open questions')"
            echo "human=$(count '^ *-? *by: *human:')"
          } >> "$GITHUB_OUTPUT"

      # Hand the proposed change to the privileged job as a patch (captures adds,
      # edits and deletes under the bundle, plus ktl-docent's feedback.md). The
      # agent never sees a write token; `publish` applies this on a clean checkout.
      - name: Package the bundle change
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add -A -- .lokf/knowledge
          # The bundle's second name, when a host has made it a real folder
          # (see "Detect changes"); `git add` refuses a pathspec that matches
          # nothing, hence the guard.
          [ -e knowledge_bundle ] && git add -A -- knowledge_bundle || true
          # Reader feedback (written by ktl-docent, consumed by the librarian,
          # which removes handled entries) - carry it so entries don't come back.
          [ -e .lokf/feedback.md ] && git add -A -- .lokf/feedback.md || true
          git diff --cached --binary > "$RUNNER_TEMP/librarian.patch"

      - name: Upload the bundle patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librarian-bundle-patch
          path: ${{ runner.temp }}/librarian.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Open the review PR (privileged, no agent)
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/push the librarian branch
      pull-requests: write # open the review PR
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the bundle patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librarian-bundle-patch
          path: ${{ runner.temp }}

      - name: Commit and push the librarian branch
        id: push
        run: |
          set -euo pipefail
          # Trust nothing the `refresh` job decided on its own - it shared a
          # workspace with the agent, so its checks can in principle be
          # blinded or skipped (see the wrapper script's comments). Re-derive
          # the path check here, on this job's clean checkout, before
          # anything from the patch touches disk. core.quotePath off, or a
          # concept named with a byte above 0x7f is listed C-quoted and
          # refused as outside the bundle.
          paths="$(git -c core.quotePath=false apply --numstat "$RUNNER_TEMP/librarian.patch" | cut -f3-)"
          bad="$(printf '%s\n' "$paths" | grep -Ev '^(\.lokf/knowledge/|knowledge_bundle/|\.lokf/feedback\.md$)' || true)"
          if [ -n "${bad//[$'\n\t ']/}" ]; then
            echo "::error::Patch touches paths outside the allowed bundle:"
            printf '%s\n' "$bad" | sed '/^$/d; s/^/  /'
            exit 1
          fi
          # This skill never writes a human: confirmation (see ktl-librarian's
          # SKILL.md). A PR opened with GITHUB_TOKEN never fires
          # knowledge-registrar.yaml's own pull_request-triggered provenance
          # job - GitHub does not start pull_request workflows for a PR
          # authored by the default token - so this is that check's only
          # backstop for this particular PR; see scheduled-task.md.
          if grep -Eq '^\+ *-? *by: *human:' "$RUNNER_TEMP/librarian.patch"; then
            echo "::error::Patch adds a 'by: human:' claim - the scheduled librarian must never author one."
            exit 1
          fi
          # Apply the agent's proposed change onto a clean checkout; fails safe if
          # the default branch moved since `refresh` ran.
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/librarian.patch"
          branch="knowledge-librarian/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name  "knowledge-librarian[bot]"
          git config user.email "knowledge-librarian[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(lokf): scheduled librarian refresh of the knowledge bundle" \
                     -m "Automated Karpathy-rule pass. Review required - do not auto-merge."
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the review PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          LOKF_OUTCOME: ${{ needs.refresh.outputs.validate_outcome }}
          DRAFTS: ${{ needs.refresh.outputs.drafts }}
          QUESTIONS: ${{ needs.refresh.outputs.questions }}
          HUMAN: ${{ needs.refresh.outputs.human }}
        with:
          script: |
            const { BRANCH, LOKF_OUTCOME, DRAFTS, QUESTIONS, HUMAN } = process.env;
            // On `schedule` triggers the event payload is empty, so resolve the
            // default branch via the API rather than context.payload.repository.
            const { data: repo } = await github.rest.repos.get(context.repo);
            const base = repo.default_branch;
            const check = (o) =>
              o === 'success' ? 'pass'
              : o === 'failure' ? 'failed (review the run log)'
              : 'skipped';
            const body = [
              '## Scheduled knowledge-librarian refresh',
              '',
              'Automated Karpathy-rule pass: the librarian agent re-scraped the repo',
              'and reconciled the `.lokf/` bundle. A human maintainer must review and',
              'approve - this PR must not be auto-merged.',
              '',
              `- LOKF validation (\`lokf validate --check-refs\`): ${check(LOKF_OUTCOME)}`,
              '',
              '### Reviewer checklist',
              '- [ ] Claims trace to a source of truth.',
              '- [ ] `type`/frontmatter and typed relations are correct.',
              '- [ ] Validation findings above are acceptable or addressed.',
              '',
              '### For the curator',
              `Across the whole bundle: ${DRAFTS} concept(s) are drafts (not yet confirmed by a person),`,
              `${QUESTIONS} carry open questions the librarian could not settle, and ${HUMAN} have been`,
              'confirmed by a person. The librarian derives facts; it never vouches for them. A few',
              'minutes with the **ktl-curator** skill turns drafts into confirmed knowledge - run its',
              'report for the full picture and a guided review.',
            ].join('\n');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: BRANCH,
              base,
              title: 'chore(lokf): scheduled librarian refresh of the knowledge bundle',
              body,
            });
            console.log(`Opened PR #${pr.number}: ${pr.html_url}`);
