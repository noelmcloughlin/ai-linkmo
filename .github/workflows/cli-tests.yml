name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - "ai"
      - "lib/api/**"
      - "lib/cli/**"
      - "lib/store/**"
      - "lib/browse/**"
      - "lib/test/**"
      - "scripts/**"
      - "byo/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cli-tests.yml"
  pull_request:
    paths:
      - "ai"
      - "lib/api/**"
      - "lib/cli/**"
      - "lib/store/**"
      - "lib/browse/**"
      - "lib/test/**"
      - "scripts/**"
      - "byo/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/cli-tests.yml"
  workflow_dispatch:

# Least-privilege default: every scope starts at none. The job below opts back
# into only the read access it needs to check out code; no other job (present
# or future) inherits more. `pull_request` (not `pull_request_target`) already
# keeps a fork PR's GITHUB_TOKEN read-only and its run secret-free. This is
# defense in depth, not what makes fork PRs safe here.
permissions: {}

concurrency:
  group: cli-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Monitors the runner's outbound network traffic for the rest of this job
      # and flags anything unexpected. It is the main defense here against a
      # compromised dependency phoning home, doubly relevant on a job that also
      # builds arbitrary fork PR branches. Audit mode only: it observes and
      # reports rather than blocking, since hand-maintaining an exact egress
      # allowlist would be fragile against ordinary dependency churn. See
      # https://github.com/step-security/harden-runner.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # --locked fails the run if uv.lock is out of step with pyproject.toml,
      # rather than silently resolving something the lockfile never pinned. CI
      # then tests the same dependency set a developer gets from `uv sync`. The
      # browse extra (Datasette and sqlite-utils) is what lib/test/test_browse.py
      # needs; without it those tests skip.
      - name: Install dependencies
        run: uv sync --locked --extra test --extra browse

      # The store is a build artefact (lib/store/loader.py); the suite's store
      # tests read it, and the validation step below checks it.
      - name: Build the store
        run: uv run python scripts/load_store.py

      # Reads linkml-store's findings rather than its exit code, which says
      # nothing. --allow is the number of findings upstream's data produces
      # today, 30 (scripts/validate_store.py lists the kinds). It is upstream's
      # data debt and must only go down: lower it when a row is fixed upstream,
      # never raise it to admit a new finding. Only the packaged database is
      # checked here: the byo files add no findings, and the referential pass
      # costs about three minutes per database.
      - name: Validate the store
        run: uv run python scripts/validate_store.py lib/store/data/config.yaml --database atlas --allow 30

      # Excludes tests marked "slow": local-mode CLI runs (each spawns a
      # fresh interpreter and loads the full ontology, ~25 min) and the
      # consistency/help/invalid-scope checks. API-mode CLI examples plus
      # the API/security/handler test modules still run, backed by the
      # session-scoped `api_server` fixture in lib/test/conftest.py.
      - name: Run test suite (API mode, not slow)
        run: uv run pytest lib/test -v -m "not slow" --tb=short
