name: Knowledge Registrar

# The registrar's job: keep the LOKF knowledge bundle's records well-formed and
# provenanced - never judge whether their content is true, that's the curator's
# job. Validates the bundle whenever it (or its tooling) changes, and on a
# weekly schedule.
on:
  pull_request:
    paths:
      - ".lokf/**"
      - "knowledge_bundle/**" # the bundle's second name - a link by default, a real folder on a host rearranged by hand
      - ".github/workflows/knowledge-registrar.yaml"
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

# Least-privilege default: no token scope at all unless a job opts in, the
# same default knowledge-librarian.yaml already sets. Each job below names
# exactly what it needs.
permissions: {}

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: knowledge-registrar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate the LOKF bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so the token never needs to reach the
          # checkout's credential helper, where any later step could read it.
          persist-credentials: false
          # Full history: knowledge-conventions.sh resolves each `revision`
          # against the tree, and reports a shallow clone instead of passing it.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Install the lokf sidecar
        run: uv sync
        working-directory: .lokf

      - name: Validate the knowledge bundle
        run: uv run lokf validate knowledge
        working-directory: .lokf

      # `lokf validate` reads a concept body as an opaque string and never
      # opens log.md, so the conventions the skills and both Obsidian plugins
      # rely on - one ISO-date heading per day, quoted timestamps, `verified`
      # as a list with one librarian event, open questions in the shape the
      # curator reads - are checked by the script the sidecar lays down beside
      # the agent wrapper. Each of them has been broken by an agent that had
      # the rule in prose.
      - name: Check the conventions lokf validate cannot see
        run: bash scripts/knowledge-conventions.sh knowledge
        working-directory: .lokf

      # A typed relation whose target is not a concept in the bundle is still
      # a well-formed IRI, so `lokf validate` passes it. The justfile's
      # lokf-check-refs recipe closes that gap with a SPARQL query; `just`
      # itself comes from PyPI through uvx so the runner needs nothing else.
      - name: Every typed-relation target resolves to a concept
        run: uvx --from 'rust-just==1.47.0' just lokf-check-refs
        working-directory: .lokf

  provenance:
    name: Check new human confirmations
    # A `human:<id>` verification claims that a named person checked a concept
    # against its source. Nothing in the bundle's own format proves one: any
    # writer - an agent steered by another agent, a script, a careless merge -
    # can type the string, and `lokf validate` sees a perfectly well-formed
    # event. This job is where such a claim gets tied back to a person, using
    # the only evidence the forge actually holds: who approved the pull
    # request, and who signed the commits.
    #
    # When the confirming person also opens the pull request: GitHub will not
    # let anyone approve their own pull request, so their signature on the
    # commits is the path here - it is also the stronger claim, being
    # cryptographic and checkable long after a review could be dismissed.
    # One-time setup with the SSH key already used to push:
    #
    #   git config --global gpg.format ssh
    #   git config --global user.signingkey ~/.ssh/id_ed25519.pub
    #   git config --global commit.gpgsign true
    #
    # then add that same key again at github.com/settings/keys as a
    # *signing* key - GitHub keeps auth and signing keys in separate
    # lists, this check reads GitHub's own verdict, and a key registered
    # only for auth leaves every commit Unverified. The commit email must
    # also be a verified email on the account.
    #
    # If you genuinely cannot sign, see the `attestation` job below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      actors: ${{ steps.check.outputs.actors }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads and compares history; it never pushes.
          persist-credentials: false
          fetch-depth: 0

      - name: Every new human confirmation must come from that person
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Optional, and off unless you set it: the name of an Environment
          # whose required reviewers must approve an otherwise unbacked
          # confirmation. See the `attestation` job.
          ATTEST_ENV: ${{ vars.KNOWLEDGE_CURATION_ENVIRONMENT }}
        run: |
          set -euo pipefail

          # A claim is an event in a concept's frontmatter - a `verified`
          # entry, or the `generated` record the curator's Correct writes as
          # `human:<id>` - read whole as `<id>\t<by>\t<at>\t<revision>`,
          # whatever its YAML layout, and keyed by the concept's id so a rename
          # keeps its events and a copy does not. An added line would not do:
          # a re-dated `at`, a moved `revision` or a flow-style event adds no
          # `by:` line, and a `by: human:` in a body code fence or a send-back
          # note is not an event at all. Any event present at head and absent
          # at base names an actor who must stand behind it. Same extractor as
          # knowledge-provenance.sh; the id is taken as the schema takes it, so
          # one this job cannot look up is refused below, never skipped.
          human_events() {
            awk -v path="$1" '
            function val(s) { sub(/^[^:]*:[[:space:]]*/, "", s); gsub(/["'"'"']/, "", s); sub(/[[:space:]]+$/, "", s); return s }
            function kv(l,  k) { k = l; sub(/:.*/, "", k); sub(/^[[:space:]]+/, "", k)
              if (k == "by") by = val(l); else if (k == "at") at = val(l); else if (k == "revision") rev = val(l) }
            function emit() { if (inev && by ~ /^human:/) { sub(/^human:/, "", by); out = out (cid ? cid : path) "\t" by "\t" at "\t" rev "\n" }
              inev = 0; by = ""; at = ""; rev = "" }
            function flow(s,  n, parts, i) { emit(); inev = 1; gsub(/[{}]/, "", s); n = split(s, parts, ",")
              for (i = 1; i <= n; i++) kv(parts[i]); emit() }
            BEGIN { fm = 0; inv = 0; inev = 0; cid = ""; out = "" }
            NR == 1 { if ($0 == "---") { fm = 1; next } else exit }
            fm && $0 == "---" { emit(); exit }
            /^id:/ { cid = val($0) }
            /^(verified|generated):/ { emit(); inv = 1; rest = $0; sub(/^(verified|generated):[[:space:]]*/, "", rest)
              if (rest ~ /^\{/) { flow(rest); inv = 0 }
              else if (rest ~ /^\[/) { gsub(/[][]/, "", rest); n = split(rest, items, /\}[[:space:]]*,/); for (i = 1; i <= n; i++) flow(items[i]); inv = 0 }
              next }
            inv && /^[^[:space:]-]/ { emit(); inv = 0 }
            inv && /^[[:space:]]*-[[:space:]]*\{/ { rest = $0; sub(/^[[:space:]]*-[[:space:]]*/, "", rest); flow(rest); next }
            inv && /^[[:space:]]*-[[:space:]]+/ { emit(); inev = 1; rest = $0; sub(/^[[:space:]]*-[[:space:]]+/, "", rest); kv(rest); next }
            inv && !inev && /^[[:space:]]+[a-z_]+:/ { inev = 1; kv($0); next }
            inv && inev && /^[[:space:]]+[a-z_]+:/ { kv($0); next }
            END { emit(); printf "%s", out }'
          }
          paths="$(mktemp)"
          events_in() {  # ref, paths on stdin -> the human events of those paths at that ref, sorted
            { while IFS= read -r f; do git show "$1:$f" 2>/dev/null | human_events "$f" || true; done | sort; } || true
          }
          changed_actors() {  # base head -> actors of events at head that base does not hold
            { git diff --name-only "$1" "$2" -- .lokf/knowledge knowledge_bundle | grep '\.md$' | sort -u > "$paths"
              events_in "$2" < "$paths" | comm -13 <(events_in "$1" < "$paths") - | cut -f2; } || true
          }
          # Against every parent: a merge that brings in another curator's
          # confirmation claims nothing, one that adds an event neither side
          # held is read like any other commit - and without -m, git lists no
          # paths at all for a merge.
          new_in_commit() {  # sha -> actors of events at sha that none of its parents holds
            { git diff-tree --no-commit-id --name-only -r -m "$1" -- .lokf/knowledge knowledge_bundle | grep '\.md$' | sort -u > "$paths"
              events_in "$1" < "$paths" | comm -13 <(for p in $(git rev-parse "$1^@"); do events_in "$p" < "$paths"; done | sort -u) - | cut -f2; } || true
          }

          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          mapfile -t actors < <(changed_actors "$base" "$HEAD_SHA" | sort -u)

          if [ "${#actors[@]}" -eq 0 ]; then
            echo "No new human confirmations in this pull request."
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          approvers="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
              --jq '.[] | select(.state == "APPROVED") | .user.login'
          )"

          # Signature status has to come from GitHub, not from `git log %G?`.
          # A runner has no GPG keyring and no `gpg.ssh.allowedSignersFile`,
          # so locally every signature here reads as unverifiable (`N`) no
          # matter how good it is. GitHub checks each signature against the
          # keys registered to an account - which is also what ties the
          # signature to a person, rather than merely proving one exists.
          commits="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[] | [.sha, (.commit.verification.verified | tostring), (.author.login // "-")] | @tsv' \
            > "$commits"

          mapfile -t bundle_shas < <(
            git log --format='%H' "${base}..${HEAD_SHA}" -- .lokf/knowledge knowledge_bundle
          )

          unbacked=()
          for actor in "${actors[@]}"; do
            # A GitHub login is letters, digits and hyphens; the schema's actor
            # pattern accepts more, and an id nobody can be looked up under
            # must not read as a person's confirmation.
            if ! printf '%s\n' "$actor" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "unbacked: human:${actor} is not a login this gate can check (letters, digits, . _ - only)."
              unbacked+=("$actor")
              continue
            fi
            if printf '%s\n' "$approvers" | grep -qxF -- "$actor"; then
              echo "ok: human:${actor} approved this pull request."
              continue
            fi

            # No approval from them. The remaining evidence is their own
            # signature on the commit that introduced the event - the only
            # path open when they opened the pull request themselves, since
            # GitHub will not let anyone approve their own pull request.
            introducing=()
            for sha in "${bundle_shas[@]}"; do
              if new_in_commit "$sha" | grep -qxF -- "$actor"; then
                introducing+=("$sha")
              fi
            done

            if [ "${#introducing[@]}" -eq 0 ]; then
              echo "unbacked: human:${actor} is recorded, but no commit in this pull request introduces it."
              unbacked+=("$actor")
              continue
            fi

            backed=yes
            for sha in "${introducing[@]}"; do
              info="$(awk -v s="$sha" '$1 == s { print $2, $3 }' "$commits")"
              verified="${info%% *}"
              signer="${info##* }"
              if [ "$verified" = "true" ] && [ "$signer" = "$actor" ]; then
                continue
              fi
              backed=no
              echo "unbacked: commit ${sha:0:8} records human:${actor} but GitHub reports it" \
                   "verified=${verified:-unknown}, attributed to ${signer:-unknown}."
            done

            if [ "$backed" = yes ]; then
              echo "ok: human:${actor} signed the commit recording their own confirmation."
            else
              unbacked+=("$actor")
            fi
          done

          if [ "${#unbacked[@]}" -eq 0 ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "verdict=unbacked" >> "$GITHUB_OUTPUT"
          echo "actors=${unbacked[*]}" >> "$GITHUB_OUTPUT"

          {
            echo "### Confirmations nothing stands behind"
            echo ""
            echo "This pull request records these people as having checked a concept"
            echo "against its source, but neither an approval nor a signature of theirs"
            echo "backs them:"
            echo ""
            for actor in "${unbacked[@]}"; do
              printf -- "- \`human:%s\`\n" "$actor"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ATTEST_ENV" ]; then
            echo ""
            echo "Waiting on a reviewer of the '${ATTEST_ENV}' environment to attest to these."
            exit 0
          fi

          echo ""
          echo "A 'human:' verification says a named person checked that concept"
          echo "against its source. Ask that person to approve this pull request,"
          echo "or - if it is their own, which GitHub will not let them approve -"
          echo "have them sign their commits (see this job's comments). If nobody"
          echo "actually checked it, remove the event: an unchecked concept is"
          echo "supposed to read as unchecked."
          exit 1

      # Second opinion where the repository carries curator keys: the same
      # signature check with plain git, gpg and ssh-keygen against the keys
      # on file (<id>.asc or <id>.pub) rather than GitHub's verdict, so a
      # signature from a key not on file for that id fails even when GitHub
      # shows it as Verified. A repository with no .lokf/curators/ never runs
      # it; the script itself says so and passes if run by hand. Laid down by
      # lokf-sidecar Step 5.
      - name: Verify signatures against the keys on file
        if: hashFiles('.lokf/curators/*.asc', '.lokf/curators/*.pub') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .lokf/scripts/knowledge-provenance.sh "$BASE_SHA" "$HEAD_SHA"

  attestation:
    name: Attest to an unbacked confirmation
    # The escape hatch for a repository that cannot sign commits and has
    # nobody else available to approve.
    #
    # It is deliberately NOT a switch that turns the check off. A permanent
    # "provenance: off" setting gets flipped for one urgent afternoon and
    # never flipped back, and the bundle then claims confirmations it cannot
    # support. This asks instead for a fresh human action on every pull
    # request that needs one: the run pauses, GitHub emails the environment's
    # reviewers, and someone clicks Approve in a browser. Unlike a pull
    # request review, an environment reviewer MAY be the person who opened
    # the pull request, which is what makes this work when the same person
    # opens the pull request and attests.
    # The click lands in the deployment log, so it stays auditable.
    #
    # To enable, both steps are required:
    #   1. Settings -> Environments -> New environment (e.g. "knowledge-curation"),
    #      tick "Required reviewers", and add the people allowed to attest.
    #   2. Settings -> Secrets and variables -> Actions -> Variables: set
    #      KNOWLEDGE_CURATION_ENVIRONMENT to that environment's name.
    #
    # Step 1 is what does the work. An environment with no required reviewers
    # approves itself instantly, so setting the variable while skipping the
    # reviewers silently disables the whole gate.
    needs: provenance
    if: needs.provenance.outputs.verdict == 'unbacked'
    runs-on: ubuntu-latest
    permissions: {}
    environment: ${{ vars.KNOWLEDGE_CURATION_ENVIRONMENT }}
    steps:
      - name: Record what was attested to
        env:
          ACTORS: ${{ needs.provenance.outputs.actors }}
        run: |
          set -euo pipefail
          echo "Attested by a reviewer of this environment, for: $ACTORS"
          echo "This records that a person vouched for these confirmations out of band."
          echo "It is not evidence that the concepts were checked - only that someone"
          echo "with access to this repository's settings said they were."
