name: Scorecard

# Runs the OpenSSF Scorecard on this repository and publishes the result,
# which the README's badge shows. Each finding also becomes a code scanning
# alert. Scorecard's API accepts a published result only from a job on a
# GitHub-hosted runner that runs no step but its own action, checkout,
# harden-runner and the upload actions, with no write permission at the top.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 2" # Tuesdays at 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard refuses any branch but the default one.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard and publish the result
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Add the findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
