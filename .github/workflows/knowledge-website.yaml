name: Knowledge website

# Builds the site in website/ from the knowledge bundle, the README, docs/,
# the figures and the changelog, and publishes the default branch's build to
# GitHub Pages. A pull request that touches any of them gets the same build,
# link check included, and no deployment. website/README.md says what each
# page is built from; the ktl-website skill laid both down.
#
# Two jobs, for least privilege. `build` runs the third-party packages, npm's
# and the lokf toolkit's, under a read-only token. `deploy` runs nothing but
# GitHub's own deploy-pages action, holds the Pages scopes, and runs for the
# default branch only, once the repository variable KNOWLEDGE_WEBSITE_ENABLED
# is `true`; until then this workflow builds and deploys nothing. Before
# setting it, tell Pages once to take its site from Actions, under
# Settings > Pages > Source, or with:
#   gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow
# A repository that already publishes Pages another way (a gh-pages branch, a
# docs tool's deploy) keeps the variable unset until that publisher is
# retired: two publishers overwrite each other's site.
on:
  push:
    paths:
      - "website/**"
      - ".lokf/**"
      - "knowledge_bundle/**"
      - "README.md"
      - "docs/**"
      - ".assets/**"
      - "CHANGELOG.md"
      - "llms.txt"
      - ".github/workflows/knowledge-website.yaml"
  pull_request:
    paths:
      - "website/**"
      - ".lokf/**"
      - "knowledge_bundle/**"
      - "README.md"
      - "docs/**"
      - ".assets/**"
      - "CHANGELOG.md"
      - "llms.txt"
      - ".github/workflows/knowledge-website.yaml"
  workflow_dispatch:

permissions: {} # deny by default; each job requests only the scopes it needs

# A newer push supersedes a pull request's build, but a deployment from the
# default branch always runs to the end.
concurrency:
  group: knowledge-website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site (read-only)
    # A push builds on the default branch only; a pull request or a dispatch always builds.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The whole history, because the health page's "a source moved" lines
      # come from git, as knowledge-report.sh computes them anywhere else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .lokf/uv.lock

      - name: Install the lokf toolkit the sidecar pins
        run: uv sync --locked
        working-directory: .lokf

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `build` runs the sync first and the link check after.
      - name: Build the site and check its links
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: vars.KNOWLEDGE_WEBSITE_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
