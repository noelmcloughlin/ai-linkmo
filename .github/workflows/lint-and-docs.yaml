name: Lint & docs

# Static checks for the shell, workflows, and prose this repo ships. These never
# touch the Python test suite (see cli-tests.yml), the frontend build (see
# ui-tests.yml), or the LOKF bundle's own semantics (see
# knowledge-registrar.yaml).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC, to catch link rot without a PR.
  workflow_dispatch:

# Least-privilege default, as in the other workflows.
permissions: {}

concurrency:
  group: lint-and-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          # -ignore: actionlint 1.7.12 predates the copilot-requests scope
          # knowledge-librarian.yaml requests; drop it once a release knows it.
          args: -color -ignore copilot-requests

  word-budgets:
    name: Hold the governance files to their word budgets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CONTRIBUTING.md is a checklist and SECURITY.md a policy, not design
      # logs; the budgets are the sibling repositories' and keep them so. The
      # reasoning a rule needs goes beside the code it explains, and the
      # security reasoning in docs/threat-model.md.
      - name: Count words
        run: |
          status=0
          for pair in CONTRIBUTING.md:1000 SECURITY.md:900; do
            file="${pair%%:*}"; budget="${pair##*:}"
            words="$(wc -w < "$file")"
            if [ "$words" -gt "$budget" ]; then
              echo "::error file=$file::$file has $words words, over its budget of $budget. Move the reasoning beside the code it explains and link to it."
              status=1
            else
              echo "$file: $words of $budget words"
            fi
          done
          exit "$status"

  validate-markdown:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
          config: .markdownlint-cli2.jsonc
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md"
          fail: true
      - name: codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          path: '**/*.md'
          # knowledge_bundle is a symlink to .lokf/knowledge (Obsidian vault
          # entry point, see ktl-sidecar Step 2), already checked at
          # its real path.
          skip: knowledge_bundle
