name: Lint & docs

# Static checks for the shell, workflows, and prose this repo ships. These never
# touch the Python test suite (see cli-tests.yml), the frontend build (see
# ui-tests.yml), or the LOKF bundle's own semantics (see
# knowledge-registrar.yaml).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC, to catch link rot without a PR.
  workflow_dispatch:

# Least-privilege default, as in the other workflows.
permissions: {}

concurrency:
  group: lint-and-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          # -ignore: actionlint 1.7.12 predates the copilot-requests scope
          # knowledge-librarian.yaml requests; drop it once a release knows it.
          args: -color -ignore copilot-requests

  validate-markdown:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'
          config: .markdownlint-cli2.jsonc
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress "**/*.md"
          fail: true
      - name: codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          path: '**/*.md'
