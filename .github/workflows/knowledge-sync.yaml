name: Knowledge sync

# Keeps this host's sidecar copies and skills pin at the newest release of
# Knowledge Trust Ladder. Each day it reads the ktl pin in
# .lokf/pyproject.toml and asks this host's package index for the newest ktl.
# When the pin is behind, the host's own .lokf/scripts/knowledge-sync.sh
# moves the pin, relocks, reads the release's manifest and templates from the
# locked package as data, copies them and writes the changelog entry. This
# workflow then opens one pull request with the diff. It runs no LLM, agent
# or release code, and changes the default branch only through that pull
# request.
#
# This file holds only the triggers, each job's permissions, Environment
# and secrets, and the actions. The steps' logic is in the script
# (`--workflow <step>`), so a fix to it reaches a host in its next sync pull
# request, and this file seldom changes.
#
# One pull request at a time, refreshed until it is merged. The pull request
# comes from this workflow's own branch, knowledge-sync. While it is open, a
# later run that finds a newer release replaces the branch's commits with a
# sync to that release, and sets the title and body to match. A pull request
# a person added a commit to is left alone, and so is the branch when it
# holds a commit of a person's and no pull request. A tag whose pull request
# a person closed without merging is not proposed again by the schedule. A
# run a person starts from the Actions tab may name a tag, and goes ahead in
# every case but one: a pull request that proposes that tag and is still
# open.
#
# Three jobs, for least privilege. `earlier` reads the pin, the newest
# release and the state of this workflow's branch and last pull request,
# with a token that reads the repository and its pull requests. `sync` runs
# the sync with a read-only token and no git credentials on disk, and hands
# the change to `publish` as a patch artifact. Both run in the knowledge-sync
# Environment for one thing: the credential of a private index, the secrets
# UV_INDEX_KNOWLEDGE_USERNAME and UV_INDEX_KNOWLEDGE_PASSWORD.
#
# `publish` puts the patch on with the default branch's copy of the script,
# which checks its paths and pin, checks the lock against the index, and
# keeps every workflow as it is here. It writes the pull request's body from
# that patch, and opens or refreshes the pull request. The pull request's own
# checks run the synced scripts and site files with a read-only token, as
# they run on any change here.
#
# The workflow changes a release brings are held, not pushed. A workflow on
# a branch pushed with a token runs on that push, can read every repository
# secret, and can raise its own token with a permissions: key. So the pushed
# branch carries no workflow the release wrote. The held changes are attached
# to the run as `knowledge-sync-workflows` and shown in the pull request, and
# a person who has read them applies them.
#
# `publish` pushes and opens the pull request with the KNOWLEDGE_SYNC_TOKEN
# secret, since a pull request opened with GITHUB_TOKEN starts no checks. The
# secret is a fine-grained personal access token for this repository alone,
# with Contents, Pull requests and Workflows set to read and write, or a
# GitHub App's installation token made in a step of your own. Keep it in the
# knowledge-sync Environment, limited to the default branch, so no workflow
# on another branch can read it; a repository secret of that name still
# works, with no such limit. Without the secret the workflow still runs: it
# attaches the patch to the run, writes the summary, and opens nothing. The
# sidecar's references/automation.md says how to set the token and the
# Environment up.
#
# SECURITY SCANNER NOTE. No LLM, AI agent or AI tool runs in this workflow,
# so a finding about third-party content reaching a model (Snyk W011,
# indirect prompt injection) does not apply: there is no prompt. Three other
# findings are expected, and the skills repository's docs/threat-model.md
# answers each under "The sync workflow":
#   - a package fetched at run time: `sync` installs the release's ktl
#     package as data, unbuilt, at the hash uv locks from this host's own
#     index, under contents: read. The script that reads it is this
#     repository's own, and the pull request shows every byte the sync
#     proposes;
#   - a token that can write workflows: KNOWLEDGE_SYNC_TOKEN is scoped to
#     this repository and to the default branch's knowledge-sync
#     Environment, and reaches one step of `publish` alone. It pushes one
#     branch and opens or edits one pull request; the jobs' own token keeps
#     contents: read;
#   - a forced push: only to knowledge-sync, this workflow's own branch,
#     leased to the commit the run read, and only over this workflow's own
#     commits there.
on:
  schedule:
    - cron: "10 4 * * *" # each day at 04:10 UTC, so a release reaches this host within a day
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag of Knowledge Trust Ladder to sync to, such as v0.66.0; empty for the newest release"
        required: false
        type: string

permissions: {} # deny by default; each job requests only the scopes it needs

jobs:
  earlier:
    name: Read the pin, the newest release and the last pull request (read-only)
    # The repository that publishes the skills has nothing to sync to.
    # Repository identity is the switch, not a file in the tree, as in the
    # librarian workflow's install step. A fork that develops the skills
    # changes the name in both places.
    if: github.repository != 'noelmcloughlin/knowledge-trust-ladder'
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # For the index credential alone; see the header.
    environment:
      name: knowledge-sync
      deployment: false
    permissions:
      contents: read # read the pin out of .lokf/pyproject.toml, here and on the sync branch
      pull-requests: read # read this workflow's pull requests
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      from: ${{ steps.read.outputs.from }}
      open: ${{ steps.read.outputs.open }}
      open_tag: ${{ steps.read.outputs.open_tag }}
      declined: ${{ steps.read.outputs.declined }}
      branch: ${{ steps.read.outputs.branch }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A runner that holds uv keeps its own; setup-uv fetches one from github.com.
      - name: Find uv on the runner
        id: uv
        run: if command -v uv >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set up uv
        if: steps.uv.outputs.found != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The newest release comes from the index this host's uv settings name,
      # PyPI or a mirror, with any exclude-newer cooldown the host sets. The
      # input is read through `env:` and held to the shape of a tag.
      - name: Read the pin, the newest release and the last pull request
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          UV_INDEX_KNOWLEDGE_USERNAME: ${{ secrets.UV_INDEX_KNOWLEDGE_USERNAME }}
          UV_INDEX_KNOWLEDGE_PASSWORD: ${{ secrets.UV_INDEX_KNOWLEDGE_PASSWORD }}
          WANTED: ${{ inputs.tag }}
        run: bash .lokf/scripts/knowledge-sync.sh --workflow read "$WANTED"

  sync:
    name: Sync the copies and the pin (read-only)
    needs: earlier
    if: needs.earlier.outputs.tag != ''
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # For the index credential alone; see the header.
    environment:
      name: knowledge-sync
      deployment: false
    permissions:
      contents: read # read the repository only; no write token near the release
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # keep GITHUB_TOKEN off disk while the release is read

      # A runner that holds uv keeps its own; setup-uv fetches one from github.com.
      - name: Find uv on the runner
        id: uv
        run: if command -v uv >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set up uv
        if: steps.uv.outputs.found != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The host's own copy of the script moves the pin, relocks, reads the
      # release and writes the patch. An unusable release fails the run.
      - name: Run the sync script
        id: run
        env:
          TAG: ${{ needs.earlier.outputs.tag }}
          UV_INDEX_KNOWLEDGE_USERNAME: ${{ secrets.UV_INDEX_KNOWLEDGE_USERNAME }}
          UV_INDEX_KNOWLEDGE_PASSWORD: ${{ secrets.UV_INDEX_KNOWLEDGE_PASSWORD }}
        run: bash .lokf/scripts/knowledge-sync.sh --workflow sync "$TAG"

      - name: Upload the patch
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-sync-patch
          path: |
            ${{ runner.temp }}/sync.patch
            ${{ runner.temp }}/report.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Open or refresh the review pull request (privileged)
    needs: [earlier, sync]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # One publish at a time. No job waits for a person, so a run holds the
    # turn only while it pushes.
    concurrency:
      group: knowledge-sync
      cancel-in-progress: false
    # KNOWLEDGE_SYNC_TOKEN belongs in this Environment, limited to the
    # default branch, so a workflow on any other branch cannot read it. It
    # records no deployment.
    environment:
      name: knowledge-sync
      deployment: false
    permissions:
      contents: read # the push and the pull request use the sync token, not this one
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knowledge-sync-patch
          path: ${{ runner.temp }}

      # A runner that holds uv keeps its own; setup-uv fetches one from github.com.
      - name: Find uv on the runner
        id: uv
        run: if command -v uv >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: Set up uv
        if: steps.uv.outputs.found != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      # The default branch's copy of the sync script puts the patch on. It
      # checks the paths, takes a pin at this run's tag alone, has uv resolve
      # the lock again from the index, and holds every workflow change in a
      # patch of its own. The sync token is not in this step.
      - name: Check the patch and apply it
        id: check
        env:
          TAG: ${{ needs.earlier.outputs.tag }}
          UV_INDEX_KNOWLEDGE_USERNAME: ${{ secrets.UV_INDEX_KNOWLEDGE_USERNAME }}
          UV_INDEX_KNOWLEDGE_PASSWORD: ${{ secrets.UV_INDEX_KNOWLEDGE_PASSWORD }}
        run: bash .lokf/scripts/knowledge-sync.sh --workflow apply "$TAG"

      - name: Attach the held workflow changes
        if: steps.check.outputs.held == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-sync-workflows
          path: ${{ runner.temp }}/workflows.patch
          retention-days: 30
          if-no-files-found: error

      # The push is leased to the commit the `earlier` job read, so a commit
      # added since is never lost. Without the token the run ends here,
      # green, with the patches attached and the summary written.
      - name: Commit, push and open or refresh the pull request
        env:
          TAG: ${{ needs.earlier.outputs.tag }}
          SYNC_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_TOKEN }}
          SYNC_FROM: ${{ needs.earlier.outputs.from }}
          SYNC_OPEN_PR: ${{ needs.earlier.outputs.open }}
          SYNC_OPEN_TAG: ${{ needs.earlier.outputs.open_tag }}
          SYNC_DECLINED_PR: ${{ needs.earlier.outputs.declined }}
          SYNC_LEASE: ${{ needs.earlier.outputs.branch }}
        run: bash .lokf/scripts/knowledge-sync.sh --workflow publish "$TAG"
